<section class="info-card info-card-vehicle">
  <h3 class="section-title section-title-images">Hình ảnh sự cố</h3>
  <p class="section-hint">
    Vui lòng chụp ảnh hiện trường rõ toàn bộ xe, biển số và hiện trạng
    hư hỏng để hỗ trợ xử lý nhanh và chính xác.
  </p>
  <div class="images-upload">
    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
      capture="environment"
      class="image-input-hidden"
    />
    <label for="imageInput" class="image-placeholder" id="imagePlaceholder">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
      </svg>
      <span id="imageCount">0/4</span>
    </label>
    <div class="image-thumbnails" id="imageThumbnails"></div>
  </div>
  <div style="height:10px"></div>
  <h3 class="section-title">Mô tả tình trạng xe</h3>
  <div class="vehicle-desc-wrap">
    <textarea
      class="vehicle-desc-input"
      id="vehicleStatusDesc"
      placeholder="VD: Lốp trước bên phải bị nổ, không có lốp dự phòng..."
      rows="4"
    ></textarea>
  </div>
</section>
